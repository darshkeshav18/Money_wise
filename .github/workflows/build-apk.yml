name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'database.json'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'database.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      run: |
        cd android
        gradle assembleDebug

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: MoneyWise APK v1.0.${{ github.run_number }}
        files: android/app/build/outputs/apk/debug/app-debug.apk
        body: |
          ### 📱 MoneyWise Android Build
          This is an automated build of the latest MoneyWise Android application.
          
          **Download link:**
          - [app-debug.apk](https://github.com/darshkeshav18/Money_wise/releases/download/v1.0.${{ github.run_number }}/app-debug.apk)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
